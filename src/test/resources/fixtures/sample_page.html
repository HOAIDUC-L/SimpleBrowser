<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang HTML Kiểm Thử Cục Bộ</title>
</head>
<body>
    <!-- div 1 -->
    <div id="header">
        <!-- p 1 -->
        <p class="intro">
            Chào mừng bạn đến với Simple Web Browser!
            <!-- span 1 -->
            <span class="highlight">Dự án Nhóm 1</span>
        </p>
        <!-- img 1 -->
        <img src="logo.png" alt="Logo Simple Browser" width="120" height="40" />
    </div>

    <!-- div 2 -->
    <div id="main-content">
        <!-- p 2 -->
        <p>
            Đây là đoạn văn bản thứ hai chứa thông tin chi tiết.
            <!-- span 2 -->
            <span class="author">Tác giả: Nhóm 1</span>
            <!-- span 3 -->
            <span class="date">2026-10-19</span>
        </p>

        <!-- div 3 (nested) -->
        <div class="gallery">
            <!-- p 3 -->
            <p>Bộ sưu tập hình ảnh kiểm thử:</p>
            <!-- img 2 -->
            <img src="photo1.jpg" alt="Ảnh 1" />
            <!-- img 3 -->
            <img src="photo2.jpg" alt="Ảnh 2" />
        </div>

        <!-- p 4 -->
        <p>
            Đoạn văn bản thứ tư chứa liên kết và
            <!-- span 4 -->
            <span>thẻ span nội tuyến</span>.
        </p>
    </div>

    <!-- div 4 -->
    <div id="footer">
        <!-- p 5 -->
        <p>
            <!-- span 5 -->
            <span>Bản quyền &copy; 2026</span> -
            <!-- span 6 -->
            <span>Mọi quyền được bảo lưu</span>.
        </p>
    </div>
</body>
</html>
